<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Prime RLM — Verification Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>prime-rlm <span class="dim">/ verification evidence</span></h1>
    <p id="runs-dir" class="dim"></p>
  </header>
  <main>
    <section id="stats" class="stats"></section>
    <table id="runs">
      <thead>
        <tr><th>status</th><th>run</th><th>repository</th><th>base</th><th>duration</th><th>checks</th><th>files</th><th>events</th><th>retry</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <section id="detail" hidden>
      <h2>receipt <span id="detail-id" class="mono"></span> <button id="close-detail">×</button></h2>
      <pre id="receipt-json" class="mono"></pre>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
